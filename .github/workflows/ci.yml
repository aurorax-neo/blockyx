name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: backend/go.sum

      - name: Test
        working-directory: backend
        run: go test ./api/ ./cmd/ ./config/ ./querylog/ ./stats/ ./server/ -count=1
